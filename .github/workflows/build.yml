name: build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        continue-on-error: true
        run: |
          M=https://media.githubusercontent.com/media/salimt/football-datasets/main/datalake/transfermarkt
          R=https://raw.githubusercontent.com/salimt/football-datasets/main/datalake/transfermarkt
          curl -L -o perf.csv $M/player_performances/player_performances.csv
          curl -L -o prof.csv $R/player_profiles/player_profiles.csv
          ls -l perf.csv prof.csv > log.txt
          head -1 perf.csv > ucl_performances.csv
          grep -i "champions league" perf.csv >> ucl_performances.csv || true
          python3 - <<'PY'
          import csv
          ids={r['player_id'] for r in csv.DictReader(open('ucl_performances.csv',encoding='utf-8',errors='replace'))}
          src=csv.DictReader(open('prof.csv',encoding='utf-8',errors='replace'))
          with open('ucl_profiles.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,src.fieldnames or ['player_id']); w.writeheader()
              for row in src:
                  if row.get('player_id') in ids: w.writerow(row)
          PY
          wc -l ucl_performances.csv ucl_profiles.csv >> log.txt
          rm -f perf.csv prof.csv
      - name: save
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m data || true
          git push || true
