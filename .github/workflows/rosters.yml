name: rosters
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        continue-on-error: true
        run: |
          M=https://media.githubusercontent.com/media/salimt/football-datasets/main/datalake/transfermarkt
          R=https://raw.githubusercontent.com/salimt/football-datasets/main/datalake/transfermarkt
          curl -L -o perf.csv $M/player_performances/player_performances.csv
          curl -L -o prof.csv $R/player_profiles/player_profiles.csv
          ls -l perf.csv prof.csv > log2.txt
          python3 - <<'PY'
          import csv
          IDS={2,5,11,12,13,14,15,16,18,20,24,26,27,31,33,36,40,41,44,46,58,62,79,82,84,86,88,89,114,116,119,122,124,130,131,141,148,150,156,157,159,162,164,170,190,195,197,204,206,208,232,234,237,238,239,244,255,260,265,272,273,279,281,290,294,301,306,312,317,321,336,338,368,369,371,383,398,399,403,405,409,410,418,419,430,447,449,452,496,504,506,533,540,583,602,610,621,631,660,669,681,683,699,709,713,720,762,790,800,801,826,865,897,932,938,940,941,964,969,985,995,1003,1008,1017,1025,1041,1049,1050,1053,1064,1075,1082,1083,1084,1090,1096,1184,1231,1443,2282,2410,2441,2481,2503,2698,2778,2781,2784,3057,3899,3911,4772,4959,6195,6890,7769,10442,10625,12321,16704,22220,23826,31614}
          YEARS={'%02d/%02d'%(y%100,(y+1)%100) for y in range(2000,2025)}
          need=['player_id','season_name','competition_id','competition_name','team_id','team_name',
                'nb_in_group','nb_on_pitch','goals','assists','minutes_played']
          ids=set(); kept=0
          with open('perf.csv',encoding='utf-8',errors='replace',newline='') as f, \
               open('club_rosters.csv','w',encoding='utf-8',newline='') as o:
              r=csv.DictReader(f); w=csv.DictWriter(o,need); w.writeheader()
              for row in r:
                  if row.get('season_name') in YEARS and row.get('team_id','').isdigit() and int(row['team_id']) in IDS:
                      w.writerow({k:row.get(k,'') for k in need}); ids.add(row['player_id']); kept+=1
          open('log2.txt','a').write('roster rows %d players %d\n'%(kept,len(ids)))
          src=csv.DictReader(open('prof.csv',encoding='utf-8',errors='replace'))
          with open('roster_profiles.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,src.fieldnames); w.writeheader()
              n=0
              for row in src:
                  if row.get('player_id') in ids: w.writerow(row); n+=1
          open('log2.txt','a').write('profiles %d\n'%n)
          PY
          wc -c club_rosters.csv roster_profiles.csv >> log2.txt
          rm -f perf.csv prof.csv
      - name: save
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m rosters || true
          git push || true
