name: build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          B=https://media.githubusercontent.com/media/salimt/football-datasets/main/datalake/transfermarkt
          curl -sL -o perf.csv $B/player_performances/player_performances.csv
          curl -sL -o prof.csv $B/player_profiles/player_profiles.csv
          head -1 perf.csv > ucl_performances.csv
          grep -i "champions league" perf.csv >> ucl_performances.csv
          python3 - <<'PY'
          import csv
          ids={r['player_id'] for r in csv.DictReader(open('ucl_performances.csv',encoding='utf-8',errors='replace'))}
          src=csv.DictReader(open('prof.csv',encoding='utf-8',errors='replace'))
          with open('ucl_profiles.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,src.fieldnames); w.writeheader()
              for row in src:
                  if row['player_id'] in ids: w.writerow(row)
          PY
          rm perf.csv prof.csv
          wc -l ucl_performances.csv ucl_profiles.csv
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add ucl_performances.csv ucl_profiles.csv
          git commit -m "ucl data"
          git push
